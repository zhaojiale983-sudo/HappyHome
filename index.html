<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fff8e9">
<title>HappyHome</title>
<style>
:root{--bg:#fff8e9;--paper:#fffdf8;--pink:#c9879a;--ink:#79665b;--muted:#ae9b8c;--line:#eedfd0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft YaHei",sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.app{max-width:760px;margin:auto;padding:18px 15px 50px}
header{text-align:center;padding:25px 0 15px}
.logo{font:42px Georgia;color:var(--pink);margin:7px}
.sub{font-size:11px;letter-spacing:3px;color:var(--muted)}
.search input,.field input,.field textarea,.field select{
 width:100%;padding:12px 14px;border:1px solid var(--line);
 border-radius:13px;background:white;outline:none
}
.search{margin:16px 0}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:17px;margin:13px 0}
h2{font-size:19px;color:var(--pink);margin:5px 0 15px}
h3{font-size:15px;margin:5px 0;color:var(--pink)}
p{line-height:1.7}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile,.entry{background:var(--paper);border:1px solid var(--line);border-radius:17px;padding:17px 12px;text-align:center}
.tile .ico{font-size:29px;margin-bottom:8px}
.tile strong{display:block;font-size:14px}
.tile small{display:block;color:var(--muted);margin-top:5px}
button.primary,.action{background:#dba5b1;color:white;border:0;border-radius:12px;padding:10px 15px}
button.soft{background:#fff0f1;border:1px solid #f0d9dd;color:#a97884;border-radius:12px;padding:9px 13px}
button.danger{background:#fff0ed;color:#b66c60;border:1px solid #f1d6cf;border-radius:12px;padding:9px 13px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.toolbar button{font-size:13px}
.hidden{display:none!important}
.back{border:0;background:transparent;color:var(--pink);padding:8px 0}
.list{display:grid;gap:10px;margin-top:14px}
.entry{text-align:left;display:flex;align-items:center;gap:12px}
.entry .entryicon{font-size:25px}
.entry .entryname{font-weight:bold;flex:1;overflow-wrap:anywhere}
.entry small{display:block;color:var(--muted);font-weight:normal;margin-top:4px}
.field{margin:12px 0}
.field label{display:block;font-size:13px;margin-bottom:6px;color:#9b8176}
.field textarea{min-height:180px;resize:vertical}
.modal{position:fixed;inset:0;background:#51443b66;display:flex;align-items:center;justify-content:center;padding:15px;z-index:5}
.modalbox{background:var(--paper);border-radius:20px;padding:20px;width:min(100%,540px);max-height:88vh;overflow:auto}
.modalbox h2{margin-top:0}
.itemactions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.itemactions button{font-size:12px}
.tag{font-size:11px;color:#ad8790;background:#fff0f1;border-radius:20px;padding:4px 8px}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
footer{text-align:center;color:#b8a596;font-size:11px;margin-top:30px}
.preview{font-size:25px;line-height:1.7;overflow-wrap:anywhere}
</style>
</head>
<body>
<div class="app">
<header>
 <div style="font-size:27px;color:#d69aaa">୨୧</div>
 <div class="logo">HappyHome</div>
 <div class="sub">MY LITTLE PRIVATE HOME</div>
</header>

<div id="home">
 <div class="search"><input id="globalSearch" placeholder="⌕ 搜索我的小屋……"></div>
 <section class="panel">
  <h2>Welcome Home ♡</h2>
  <p>欢迎回到你的小天地。把喜欢的资料、灵感和珍藏，都好好收纳在这里。</p>
 </section>
 <div class="grid" id="tiles"></div>
</div>

<div id="section" class="hidden">
 <button class="back" id="back">← 返回首页</button>
 <div class="panel">
  <h2 id="sectionTitle"></h2>
  <div id="sectionTools"></div>
  <div id="sectionBody"></div>
 </div>
</div>

<div id="modal" class="modal hidden">
 <div class="modalbox">
  <h2 id="modalTitle">编辑</h2>
  <div id="modalBody"></div>
  <div class="toolbar">
   <button class="primary" id="save">保存</button>
   <button class="soft" id="cancel">取消</button>
  </div>
 </div>
</div>
<footer>୨୧ HappyHome · A little place of my own ୨୧</footer>
</div>

<script>
const sections=[
 {id:"phone",name:"小手机",icon:"📱",desc:"免费 · 付费"},
 {id:"api",name:"API 地址",icon:"🔗",desc:"收纳连接地址"},
 {id:"world",name:"世界书",icon:"📚",desc:"整理与收藏"},
 {id:"preset",name:"预设",icon:"🎀",desc:"我的专属预设"},
 {id:"persona",name:"人设",icon:"🧸",desc:"角色资料收藏"},
 {id:"beauty",name:"美化",icon:"🌷",desc:"装饰与主题素材"},
 {id:"font",name:"字体",icon:"✒️",desc:"字体收藏与预览"}
];
const KEY="happyhome-data-v1";
let data={};
try{data=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){data={}}
sections.forEach(s=>{if(!data[s.id])data[s.id]=[]});
let current=null,editing=null,filter="全部";
const $=id=>document.getElementById(id);
function persist(){localStorage.setItem(KEY,JSON.stringify(data))}
function esc(s=""){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function home(){
 $("home").classList.remove("hidden");$("section").classList.add("hidden");
 $("tiles").innerHTML=sections.map(s=>`<button class="tile" data-open="${s.id}">
 <div class="ico">${s.icon}</div><strong>${s.name}</strong><small>${s.desc}</small></button>`).join("");
 document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openSection(b.dataset.open));
}
function openSection(id){
 current=id;filter="全部";
 $("home").classList.add("hidden");$("section").classList.remove("hidden");
 $("sectionTitle").textContent=sections.find(s=>s.id===id).icon+" "+sections.find(s=>s.id===id).name;
 render();
}
$("back").onclick=home;
function categories(){return ["默认分类",...new Set(data[current].map(x=>x.category||"默认分类").filter(x=>x!=="默认分类"))]}
function render(){
 const isGrouped=["world","preset","beauty"].includes(current);
 let records=data[current];
 let tools=`<div class="toolbar"><button class="primary" id="add">＋ 新增</button>
 <button class="soft" id="import">导入文件</button>
 <button class="soft" id="exportAll">导出全部</button></div>`;
 if(isGrouped){
  tools+=`<div class="toolbar"><select id="catFilter">${categories().map(c=>`<option ${c===filter?"selected":""}>${esc(c)}</option>`).join("")}</select>
  <button class="soft" id="newCat">＋ 新建分类</button></div>`;
 }
 if(current==="font")tools+=`<div class="field"><label>字体预览文字</label><input id="fontTest" value="HappyHome 你好，世界！123"></div><div id="fontPreview" class="preview">HappyHome 你好，世界！123</div>`;
 $("sectionTools").innerHTML=tools;
 let list=records.filter(x=>(!isGrouped||filter==="全部"||x.category===filter)&&
  (current!=="font"||true));
 if(isGrouped&&filter==="全部"){}
 $("sectionBody").innerHTML=list.length?`<div class="list">${list.map(x=>entryHTML(x)).join("")}</div>`:`<div class="empty">୨୧ 这里还没有内容，点击「新增」或「导入文件」开始收藏吧。</div>`;
 $("add").onclick=()=>editItem(null);
 $("import").onclick=()=>filePicker();
 $("exportAll").onclick=()=>download("happyhome-"+current+".json",JSON.stringify(records,null,2),"application/json");
 if(isGrouped){
  $("catFilter").onchange=e=>{filter=e.target.value;render()};
  $("newCat").onclick=()=>{let n=prompt("请输入新分类名称");if(n){filter=n;render()}};
 }
 if(current==="font"){$("fontTest").oninput=e=>$("fontPreview").textContent=e.target.value}
 document.querySelectorAll("[data-action]").forEach(b=>b.onclick=()=>itemAction(b.dataset.action,b.dataset.id));
}
function entryHTML(x){
 return `<div class="entry"><div class="entryicon">${esc(x.icon||"📄")}</div>
 <div class="entryname">${esc(x.name||"未命名")}<small>${esc(x.category||"")}</small>
 <div class="itemactions">
 <button class="soft" data-action="view" data-id="${x.id}">查看</button>
 <button class="soft" data-action="edit" data-id="${x.id}">编辑</button>
 <button class="soft" data-action="copy" data-id="${x.id}">复制</button>
 <button class="soft" data-action="download" data-id="${x.id}">下载</button>
 <button class="danger" data-action="delete" data-id="${x.id}">删除</button>
 </div></div></div>`;
}
function itemAction(action,id){
 let x=data[current].find(a=>a.id===id);if(!x)return;
 if(action==="edit")return editItem(x);
 if(action==="view")return viewItem(x);
 if(action==="copy"){data[current].push({...x,id:uid(),name:x.name+"（副本）"});persist();render();return}
 if(action==="download"){download((x.name||"资料")+".txt",x.content||JSON.stringify(x,null,2),"text/plain");return}
 if(action==="delete"&&confirm("确定删除这份资料吗？")){data[current]=data[current].filter(a=>a.id!==id);persist();render()}
}
function field(label,name,value="",type="text"){
 return `<div class="field"><label>${label}</label><input name="${name}" type="${type}" value="${esc(value)}"></div>`;
}
function editItem(x){
 editing=x?.id||null;
 let phone=current==="phone",api=current==="api",grouped=["world","preset","beauty"].includes(current);
 let fields=field("名称","name",x?.name||"")+
 (phone||api?field("图标（可填写 emoji）","icon",x?.icon||"📄"):"");
 if(phone)fields+=field("简介","description",x?.description||"")+field("密码","password",x?.password||"","password")+field("网址","url",x?.url||"");
 if(api)fields+=field("地址","address",x?.address||"")+field("密码","password",x?.password||"","password")+field("URL","url",x?.url||"")+field("密钥","key",x?.key||"","password");
 if(grouped)fields+=`<div class="field"><label>分类</label><select name="category">${categories().map(c=>`<option ${c===(x?.category||"默认分类")?"selected":""}>${esc(c)}</option>`).join("")}</select></div>`;
 if(current==="phone")fields+=`<div class="field"><label>类型</label><select name="category"><option>免费</option><option>付费</option></select></div>`;
 if(current==="persona")fields+=field("简介","description",x?.description||"");
 if(current==="beauty")fields+=field("文件说明","description",x?.description||"");
 if(current==="font")fields+=field("字体说明","description",x?.description||"");
 fields+=`<div class="field"><label>内容 / 备注</label><textarea name="content">${esc(x?.content||"")}</textarea></div>`;
 $("modalTitle").textContent=x?"编辑资料":"新增资料";
 $("modalBody").innerHTML=fields;
 $("modal").classList.remove("hidden");
 $("save").onclick=()=>{
  const obj={};$("modalBody").querySelectorAll("[name]").forEach(el=>obj[el.name]=el.value);
  if(phone&&!obj.category)obj.category="免费";
  let old=x||{};
  let next={...old,...obj,id:x?.id||uid()};
  if(editing)data[current]=data[current].map(a=>a.id===editing?next:a);
  else data[current].push(next);
  persist();$("modal").classList.add("hidden");render();
 };
}
function viewItem(x){
 $("modalTitle").textContent=x.name||"资料内容";
 $("modalBody").innerHTML=`<div class="field"><label>完整内容</label><pre style="white-space:pre-wrap;overflow-wrap:anywhere">${esc(x.content||x.description||"暂无内容")}</pre></div>`;
 $("save").classList.add("hidden");$("cancel").textContent="关闭";$("modal").classList.remove("hidden");
}
function closeModal(){$("modal").classList.add("hidden");$("save").classList.remove("hidden");$("cancel").textContent="取消"}
$("cancel").onclick=closeModal;
function download(name,content,mime){
 const a=document.createElement("a"),u=URL.createObjectURL(new Blob([content],{type:mime}));
 a.href=u;a.download=name;a.click();URL.revokeObjectURL(u);
}
function filePicker(){
 let input=document.createElement("input");input.type="file";input.multiple=true;
 input.onchange=async()=>{
  for(const f of input.files){
   let content="";
   try{content=await f.text()}catch(e){content="此文件暂不支持文本预览，请下载查看。"}
   data[current].push({id:uid(),name:f.name,category:"默认分类",content,icon:"📄",description:"导入文件"});
  }
  persist();render();
 };input.click();
}
$("globalSearch").oninput=e=>{
 let q=e.target.value.trim().toLowerCase();
 if(!q){home();return}
 $("home").classList.remove("hidden");$("section").classList.add("hidden");
 let found=[];
 sections.forEach(s=>data[s.id].forEach(x=>{
  if(JSON.stringify(x).toLowerCase().includes(q))found.push({s,x});
 }));
 $("tiles").innerHTML=found.length?found.map(({s,x})=>`<div class="tile" data-result="${s.id}" data-id="${x.id}">
 <div class="ico">${s.icon}</div><strong>${esc(x.name)}</strong><small>${s.name}</small></div>`).join(""):`<div class="empty">没有找到相关内容</div>`;
 document.querySelectorAll("[data-result]").forEach(b=>b.onclick=()=>{openSection(b.dataset.result);setTimeout(()=>{let el=document.querySelector('[data-id="'+b.dataset.id+'"]');if(el)el.scrollIntoView({behavior:"smooth"})},50)});
};
home();
</script>
</body>
</html>
