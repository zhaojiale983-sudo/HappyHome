<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>HappyHome</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co/jNcmRdK/retouch-2026111500295066.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg-cream: #FFFDF7;
            --card-cream: #FFF8E7;
            --accent-yellow: #FFD97D;
            --accent-caramel: #F4A261;
            --accent-pink: #FFCAD4;
            --text-brown: #5C4B3B;
            --text-light: #9E8C7A;
            --border-soft: #F3E5C8;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-cream);
            color: var(--text-brown);
            margin: 0;
            padding: 16px 16px 80px 16px;
            max-width: 600px;
            margin: 0 auto;
        }

        /* 欢迎封面样式 */
        #coverPage {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-cream);
            z-index: 200;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 20px;
            transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        #coverPage.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .cover-logo {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--accent-yellow);
            box-shadow: 0 8px 25px rgba(244, 162, 97, 0.25);
            margin-bottom: 22px;
            animation: bounce 2s infinite ease-in-out;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .cover-title {
            font-size: 2.2rem;
            color: var(--text-brown);
            margin: 0 0 8px 0;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .cover-subtitle {
            font-size: 0.95rem;
            color: var(--text-light);
            margin-bottom: 35px;
        }
        .cover-btn {
            background: var(--accent-yellow);
            color: var(--text-brown);
            border: 2px solid var(--accent-caramel);
            padding: 14px 36px;
            border-radius: 30px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 18px rgba(255, 217, 125, 0.6);
            transition: transform 0.15s;
        }
        .cover-btn:active { transform: scale(0.95); }

        /* 主界面样式 */
        header {
            text-align: center;
            padding: 12px 0 18px 0;
        }
        header h1 {
            margin: 0;
            font-size: 1.8rem;
            color: var(--text-brown);
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }
        header h1 img {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--accent-yellow);
        }

        .search-box {
            position: relative;
            margin-bottom: 16px;
        }
        .search-box input {
            width: 100%;
            padding: 12px 16px 12px 40px;
            border-radius: 20px;
            border: 2px solid var(--border-soft);
            background: #FFFFFF;
            color: var(--text-brown);
            font-size: 0.95rem;
            outline: none;
            box-shadow: 0 4px 12px rgba(244, 162, 97, 0.08);
        }
        .search-box input:focus { border-color: var(--accent-yellow); }
        .search-box::before {
            content: "🔍";
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1rem;
        }

        .tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            margin-bottom: 14px;
            scrollbar-width: none;
        }
        .tabs::-webkit-scrollbar { display: none; }
        .tab-btn {
            flex: 0 0 auto;
            padding: 8px 16px;
            border-radius: 16px;
            border: 1.5px solid var(--border-soft);
            background: #FFFFFF;
            color: var(--text-brown);
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .tab-btn.active {
            background: var(--accent-yellow);
            border-color: var(--accent-caramel);
            color: #4A3828;
            box-shadow: 0 3px 8px rgba(255, 217, 125, 0.5);
        }

        .sub-category-bar {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: var(--card-cream);
            padding: 12px;
            border-radius: 16px;
            border: 1.5px dashed var(--accent-caramel);
            margin-bottom: 16px;
        }
        .cat-row {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .cat-label { font-size: 0.8rem; font-weight: bold; color: var(--text-light); }
        .cat-chip {
            padding: 4px 10px;
            border-radius: 12px;
            background: #FFFFFF;
            border: 1px solid var(--border-soft);
            font-size: 0.8rem;
            cursor: pointer;
        }
        .cat-chip.active {
            background: var(--accent-pink);
            border-color: #F29CA3;
            font-weight: bold;
        }
        .cat-add-btn {
            padding: 2px 8px;
            border-radius: 10px;
            background: var(--accent-yellow);
            border: none;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.85rem;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }
        .list-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .square-card {
            background: #FFFFFF;
            border: 2px solid var(--border-soft);
            border-radius: 20px;
            padding: 14px 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            aspect-ratio: 1 / 1;
            box-shadow: 0 4px 10px rgba(92, 75, 59, 0.05);
            cursor: pointer;
            position: relative;
            transition: transform 0.15s;
        }
        .square-card:active { transform: scale(0.95); }
        .square-icon {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: var(--card-cream);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 8px;
            overflow: hidden;
            border: 1px solid var(--border-soft);
        }
        .square-icon img { width: 100%; height: 100%; object-fit: cover; }
        .square-title {
            font-size: 0.85rem;
            font-weight: bold;
            width: 100%;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .badge-pwd {
            position: absolute;
            top: 6px;
            right: 6px;
            font-size: 0.7rem;
            background: var(--card-cream);
            padding: 2px 5px;
            border-radius: 8px;
        }

        .add-card {
            background: var(--card-cream);
            border: 2px dashed var(--accent-caramel);
            color: var(--accent-caramel);
        }
        .add-card .plus { font-size: 2rem; line-height: 1; margin-bottom: 4px; }
        .add-card span { font-size: 0.8rem; font-weight: bold; }

        .file-card {
            background: #FFFFFF;
            border: 1.5px solid var(--border-soft);
            border-radius: 16px;
            padding: 12px 14px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px rgba(92, 75, 59, 0.04);
        }
        .file-info { flex: 1; overflow: hidden; cursor: pointer; }
        .file-name { font-weight: bold; font-size: 0.95rem; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .file-tags { display: flex; gap: 6px; font-size: 0.75rem; color: var(--text-light); }
        .file-tag { background: var(--card-cream); padding: 2px 8px; border-radius: 8px; }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(92, 75, 59, 0.4);
            backdrop-filter: blur(3px);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 16px;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: var(--bg-cream);
            border: 2px solid var(--accent-yellow);
            border-radius: 24px;
            width: 100%;
            max-width: 460px;
            max-height: 85vh;
            overflow-y: auto;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            font-weight: bold;
            font-size: 1.1rem;
        }
        .close-btn {
            background: var(--card-cream);
            border: none;
            width: 30px; height: 30px;
            border-radius: 50%;
            font-size: 1rem;
            cursor: pointer;
            color: var(--text-brown);
        }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 4px; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border-radius: 12px;
            border: 1.5px solid var(--border-soft);
            background: #FFFFFF;
            color: var(--text-brown);
            font-size: 0.9rem;
            font-family: inherit;
        }
        .form-group textarea { min-height: 180px; resize: vertical; line-height: 1.5; }
        .btn-primary {
            width: 100%;
            padding: 12px;
            border-radius: 14px;
            border: none;
            background: var(--accent-yellow);
            color: #4A3828;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 6px;
        }
        .btn-danger { background: #FFE5E5; color: #D9534F; margin-top: 8px; }

        .browser-list { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
        .browser-btn {
            padding: 12px;
            border-radius: 14px;
            border: 1.5px solid var(--border-soft);
            background: #FFFFFF;
            color: var(--text-brown);
            font-weight: bold;
            text-align: center;
            text-decoration: none;
            display: block;
            font-size: 0.95rem;
        }
        .browser-btn:active { background: var(--accent-yellow); }
        .copy-info-box {
            background: var(--card-cream);
            padding: 10px;
            border-radius: 12px;
            font-size: 0.85rem;
            margin-bottom: 12px;
            word-break: break-all;
        }
        .mini-copy-btn {
            background: var(--accent-caramel);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 3px 8px;
            font-size: 0.75rem;
            margin-left: 6px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- 欢迎封面层 -->
    <div id="coverPage">
        <img src="https://i.ibb.co/jNcmRdK/retouch-2026111500295066.png" alt="HappyHome Logo" class="cover-logo">
        <h1 class="cover-title">HappyHome</h1>
        <p class="cover-subtitle">✨ 欢迎回家，开启你的专属温馨小窝 ✨</p>
        <button class="cover-btn" onclick="enterApp()">点击进入 🐾</button>
    </div>

    <header>
        <h1><img src="https://i.ibb.co/jNcmRdK/retouch-2026111500295066.png" alt="logo"> HappyHome</h1>
    </header>

    <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索小手机、API、世界书、美化、字体..." oninput="renderMain()">
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('phone', this)">📱 小手机</button>
        <button class="tab-btn" onclick="switchTab('api', this)">🔌 API站子</button>
        <button class="tab-btn" onclick="switchTab('worldbook', this)">📖 世界书</button>
        <button class="tab-btn" onclick="switchTab('theme', this)">🎀 美化</button>
        <button class="tab-btn" onclick="switchTab('font', this)">🔤 字体</button>
    </div>

    <div id="mainContent"></div>

    <!-- 弹窗：小手机 -->
    <div class="modal-overlay" id="phoneModal">
        <div class="modal-box">
            <div class="modal-header">
                <span>📱 添加小手机</span>
                <button class="close-btn" onclick="closeModal('phoneModal')">✕</button>
            </div>
            <div class="form-group"><label>名称</label><input type="text" id="pName" placeholder="例如：小手机一号"></div>
            <div class="form-group"><label>链接</label><input type="url" id="pUrl" placeholder="https://..."></div>
            <div class="form-group"><label>密码 / 备注（可选）</label><input type="text" id="pPwd" placeholder="进入密码或房间号"></div>
            <button class="btn-primary" onclick="savePhone()">保存到 HappyHome</button>
        </div>
    </div>

    <!-- 弹窗：API 站子 -->
    <div class="modal-overlay" id="apiModal">
        <div class="modal-box">
            <div class="modal-header">
                <span>🔌 添加 API 站子</span>
                <button class="close-btn" onclick="closeModal('apiModal')">✕</button>
            </div>
            <div class="form-group"><label>名称</label><input type="text" id="aName" placeholder="例如：中转站A"></div>
            <div class="form-group"><label>地址链接（网页后台）</label><input type="url" id="aUrl" placeholder="https://..."></div>
            <div class="form-group"><label>登录密码（可选）</label><input type="text" id="aPwd" placeholder="账号/密码备注"></div>
            <div class="form-group"><label>接口 Base URL（可选）</label><input type="text" id="aBaseUrl" placeholder="https://api.xxx.com/v1"></div>
            <div class="form-group"><label>密钥 API Key（可选）</label><input type="text" id="aKey" placeholder="sk-..."></div>
            <button class="btn-primary" onclick="saveApi()">保存 API 站子</button>
        </div>
    </div>

    <!-- 弹窗：浏览器选择与详情 -->
    <div class="modal-overlay" id="launchModal">
        <div class="modal-box">
            <div class="modal-header">
                <span id="launchTitle">选择打开方式</span>
                <button class="close-btn" onclick="closeModal('launchModal')">✕</button>
            </div>
            <div id="launchDetails" class="copy-info-box"></div>
            <div class="browser-list" id="browserButtons"></div>
            <button class="btn-primary btn-danger" id="deleteItemBtn">删除此卡片</button>
        </div>
    </div>

    <!-- 弹窗：导入文件 -->
    <div class="modal-overlay" id="importFileModal">
        <div class="modal-box">
            <div class="modal-header">
                <span>📂 导入文件（ZIP 自动解压）</span>
                <button class="close-btn" onclick="closeModal('importFileModal')">✕</button>
            </div>
            <div class="form-group"><label>作者分类</label><select id="impAuthor"></select></div>
            <div class="form-group"><label>功能分类</label><select id="impFunc"></select></div>
            <div class="form-group"><label>选择文件</label><input type="file" id="fileInput" multiple></div>
            <button class="btn-primary" onclick="handleFileImport()">确认导入</button>
        </div>
    </div>

    <!-- 弹窗：编辑文件 -->
    <div class="modal-overlay" id="editFileModal">
        <div class="modal-box">
            <div class="modal-header">
                <span>✏️ 编辑内容</span>
                <button class="close-btn" onclick="closeModal('editFileModal')">✕</button>
            </div>
            <div class="form-group"><label>文件名称</label><input type="text" id="editFileName"></div>
            <div class="form-group"><label>文件内容</label><textarea id="editFileContent"></textarea></div>
            <button class="btn-primary" onclick="saveFileEdit()">保存修改</button>
            <button class="btn-primary btn-danger" onclick="deleteCurrentFile()">删除此文件</button>
        </div>
    </div>
    <script>
        function enterApp() {
            const cover = document.getElementById('coverPage');
            cover.classList.add('hidden');
        }

        let db = JSON.parse(localStorage.getItem('happyhome_db')) || {
            phones: [],
            apis: [],
            files: [],
            categories: {
                worldbook: { authors: ['默认作者'], funcs: ['通用设定', '文风增强'] },
                theme: { authors: ['默认作者'], funcs: ['气泡美化', '状态栏'] },
                font: { authors: ['默认作者'], funcs: ['手写体', '可爱体'] }
            }
        };

        let currentTab = 'phone';
        let selectedAuthor = '全部';
        let selectedFunc = '全部';
        let currentEditingFileId = null;

        function saveDB() {
            localStorage.setItem('happyhome_db', JSON.stringify(db));
        }

        function switchTab(tab, btnEl) {
            currentTab = tab;
            selectedAuthor = '全部';
            selectedFunc = '全部';
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btnEl.classList.add('active');
            renderMain();
        }

        function getFavicon(url) {
            try {
                const domain = new URL(url).hostname;
                return `https://www.google.com/s2/favicons?sz=128&domain=${domain}`;
            } catch (e) {
                return '';
            }
        }

        function renderMain() {
            const container = document.getElementById('mainContent');
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            container.innerHTML = '';

            if (currentTab === 'phone') {
                const grid = document.createElement('div');
                grid.className = 'grid-container';
                grid.innerHTML += `
                    <div class="square-card add-card" onclick="openModal('phoneModal')">
                        <div class="plus">＋</div>
                        <span>添加小手机</span>
                    </div>
                `;

                db.phones.filter(p => p.name.toLowerCase().includes(keyword) || p.url.toLowerCase().includes(keyword))
                .forEach(p => {
                    const iconUrl = getFavicon(p.url);
                    grid.innerHTML += `
                        <div class="square-card" onclick="openLaunchModal('phone', ${p.id})">
                            ${p.pwd ? '<span class="badge-pwd">🔑</span>' : ''}
                            <div class="square-icon">
                                ${iconUrl ? `<img src="${iconUrl}" onerror="this.parentElement.innerHTML='📱'">` : '📱'}
                            </div>
                            <div class="square-title">${p.name}</div>
                        </div>
                    `;
                });
                container.appendChild(grid);
            } else if (currentTab === 'api') {
                const grid = document.createElement('div');
                grid.className = 'grid-container';
                grid.innerHTML += `
                    <div class="square-card add-card" onclick="openModal('apiModal')">
                        <div class="plus">＋</div>
                        <span>添加 API</span>
                    </div>
                `;

                db.apis.filter(a => a.name.toLowerCase().includes(keyword) || a.url.toLowerCase().includes(keyword))
                .forEach(a => {
                    const iconUrl = getFavicon(a.url);
                    grid.innerHTML += `
                        <div class="square-card" onclick="openLaunchModal('api', ${a.id})">
                            ${a.key ? '<span class="badge-pwd">🗝️</span>' : ''}
                            <div class="square-icon">
                                ${iconUrl ? `<img src="${iconUrl}" onerror="this.parentElement.innerHTML='🔌'">` : '🔌'}
                            </div>
                            <div class="square-title">${a.name}</div>
                        </div>
                    `;
                });
                container.appendChild(grid);
            } else {
                const cats = db.categories[currentTab];
                let catHtml = `<div class="sub-category-bar">`;
                
                catHtml += `<div class="cat-row"><span class="cat-label">按作者：</span>`;
                ['全部', ...cats.authors].forEach(au => {
                    catHtml += `<span class="cat-chip ${selectedAuthor === au ? 'active' : ''}" onclick="setFilter('author', '${au}')">${au}</span>`;
                });
                catHtml += `<button class="cat-add-btn" onclick="addCategory('authors')">＋</button></div>`;

                catHtml += `<div class="cat-row"><span class="cat-label">按功能：</span>`;
                ['全部', ...cats.funcs].forEach(fn => {
                    catHtml += `<span class="cat-chip ${selectedFunc === fn ? 'active' : ''}" onclick="setFilter('func', '${fn}')">${fn}</span>`;
                });
                catHtml += `<button class="cat-add-btn" onclick="addCategory('funcs')">＋</button></div>`;
                catHtml += `</div>`;
                container.innerHTML += catHtml;

                const list = document.createElement('div');
                list.className = 'list-container';
                list.innerHTML += `
                    <div class="file-card add-card" style="justify-content:center; padding: 16px; cursor:pointer;" onclick="openImportModal()">
                        <span style="font-size:1.2rem; margin-right:6px;">＋</span>
                        <span>导入文件 (支持 ZIP 自动解压)</span>
                    </div>
                `;

                db.files.filter(f => {
                    if (f.section !== currentTab) return false;
                    if (selectedAuthor !== '全部' && f.author !== selectedAuthor) return false;
                    if (selectedFunc !== '全部' && f.func !== selectedFunc) return false;
                    if (keyword && !f.name.toLowerCase().includes(keyword) && !f.content.toLowerCase().includes(keyword)) return false;
                    return true;
                }).forEach(f => {
                    list.innerHTML += `
                        <div class="file-card" onclick="openEditFile(${f.id})">
                            <div class="file-info">
                                <div class="file-name">📄 ${f.name}</div>
                                <div class="file-tags">
                                    <span class="file-tag">✍️ ${f.author}</span>
                                    <span class="file-tag">🏷️ ${f.func}</span>
                                </div>
                            </div>
                            <span style="color:var(--accent-caramel); font-size:0.85rem;">编辑 ›</span>
                        </div>
                    `;
                });
                container.appendChild(list);
            }
        }

        function addCategory(type) {
            const label = type === 'authors' ? '新作者名称' : '新功能分类名称';
            const val = prompt(`请输入${label}：`);
            if (val && val.trim()) {
                const list = db.categories[currentTab][type];
                if (!list.includes(val.trim())) {
                    list.push(val.trim());
                    saveDB();
                    renderMain();
                }
            }
        }

        function setFilter(type, val) {
            if (type === 'author') selectedAuthor = val;
            if (type === 'func') selectedFunc = val;
            renderMain();
        }

        function savePhone() {
            const name = document.getElementById('pName').value.trim();
            let url = document.getElementById('pUrl').value.trim();
            const pwd = document.getElementById('pPwd').value.trim();
            if (!name || !url) return alert('请填写名称和链接哦~');
            if (!url.startsWith('http')) url = 'https://' + url;

            db.phones.push({ id: Date.now(), name, url, pwd });
            saveDB();
            closeModal('phoneModal');
            document.getElementById('pName').value = '';
            document.getElementById('pUrl').value = '';
            document.getElementById('pPwd').value = '';
            renderMain();
        }

        function saveApi() {
            const name = document.getElementById('aName').value.trim();
            let url = document.getElementById('aUrl').value.trim();
            const pwd = document.getElementById('aPwd').value.trim();
            const baseUrl = document.getElementById('aBaseUrl').value.trim();
            const key = document.getElementById('aKey').value.trim();
            if (!name || !url) return alert('请填写名称和地址链接哦~');
            if (!url.startsWith('http')) url = 'https://' + url;

            db.apis.push({ id: Date.now(), name, url, pwd, baseUrl, key });
            saveDB();
            closeModal('apiModal');
            ['aName','aUrl','aPwd','aBaseUrl','aKey'].forEach(id => document.getElementById(id).value = '');
            renderMain();
        }

        function openLaunchModal(type, id) {
            const item = type === 'phone' ? db.phones.find(x => x.id === id) : db.apis.find(x => x.id === id);
            if (!item) return;

            document.getElementById('launchTitle').innerText = item.name;
            let detailsHtml = `<div>🔗 链接：${item.url}</div>`;
            if (item.pwd) detailsHtml += `<div>🔑 密码：${item.pwd} <button class="mini-copy-btn" onclick="copyText('${item.pwd}')">复制</button></div>`;
            if (type === 'api') {
                if (item.baseUrl) detailsHtml += `<div>🌐 URL：${item.baseUrl} <button class="mini-copy-btn" onclick="copyText('${item.baseUrl}')">复制</button></div>`;
                if (item.key) detailsHtml += `<div>🗝️ 密钥：${item.key} <button class="mini-copy-btn" onclick="copyText('${item.key}')">复制</button></div>`;
            }
            document.getElementById('launchDetails').innerHTML = detailsHtml;

            const cleanUrl = item.url.replace(/^https?:\/\//, '');
            const btnsHtml = `
                <a href="${item.url}" target="_blank" class="browser-btn">🧭 默认浏览器 / Safari 打开</a>
                <a href="googlechrome://navigate?url=${encodeURIComponent(item.url)}" class="browser-btn">🌐 Chrome 打开</a>
                <a href="microsoft-edge-https://${cleanUrl}" class="browser-btn">🌊 Edge 打开</a>
                <a href="via://${item.url}" class="browser-btn">⚡ Via 打开</a>
            `;
            document.getElementById('browserButtons').innerHTML = btnsHtml;

            document.getElementById('deleteItemBtn').onclick = () => {
                if (confirm(`确定要删除吗？`)) {
                    if (type === 'phone') db.phones = db.phones.filter(x => x.id !== id);
                    else db.apis = db.apis.filter(x => x.id !== id);
                    saveDB();
                    closeModal('launchModal');
                    renderMain();
                }
            };
            openModal('launchModal');
        }

        function copyText(txt) {
            navigator.clipboard.writeText(txt).then(() => alert('已复制！'));
        }

        function openImportModal() {
            const cats = db.categories[currentTab];
            document.getElementById('impAuthor').innerHTML = cats.authors.map(a => `<option value="${a}">${a}</option>`).join('');
            document.getElementById('impFunc').innerHTML = cats.funcs.map(f => `<option value="${f}">${f}</option>`).join('');
            document.getElementById('fileInput').value = '';
            openModal('importFileModal');
        }

        async function handleFileImport() {
            const files = document.getElementById('fileInput').files;
            if (!files.length) return alert('请选择文件！');
            const author = document.getElementById('impAuthor').value;
            const func = document.getElementById('impFunc').value;

            for (let file of files) {
                if (file.name.toLowerCase().endsWith('.zip')) {
                    try {
                        const zip = await JSZip.loadAsync(file);
                        for (let [relativePath, zipEntry] of Object.entries(zip.files)) {
                            if (!zipEntry.dir && !relativePath.startsWith('__MACOSX')) {
                                const content = await zipEntry.async('string');
                                db.files.push({ id: Date.now() + Math.random(), section: currentTab, name: relativePath.split('/').pop(), author, func, content });
                            }
                        }
                    } catch (e) { alert('解压失败：' + e.message); }
                } else {
                    const text = await new Promise(r => { const rd = new FileReader(); rd.onload = e => r(e.target.result); rd.readAsText(file, 'UTF-8'); });
                    db.files.push({ id: Date.now() + Math.random(), section: currentTab, name: file.name, author, func, content: text });
                }
            }
            saveDB();
            closeModal('importFileModal');
            renderMain();
        }

        function openEditFile(id) {
            const f = db.files.find(x => x.id === id);
            if (!f) return;
            currentEditingFileId = id;
            document.getElementById('editFileName').value = f.name;
            document.getElementById('editFileContent').value = f.content;
            openModal('editFileModal');
        }

        function saveFileEdit() {
            const f = db.files.find(x => x.id === currentEditingFileId);
            if (f) {
                f.name = document.getElementById('editFileName').value.trim() || f.name;
                f.content = document.getElementById('editFileContent').value;
                saveDB();
                closeModal('editFileModal');
                renderMain();
            }
        }

        function deleteCurrentFile() {
            if (confirm('确定要删除吗？')) {
                db.files = db.files.filter(x => x.id !== currentEditingFileId);
                saveDB();
                closeModal('editFileModal');
                renderMain();
            }
        }

        function openModal(id) { document.getElementById(id).classList.add('show'); }
        function closeModal(id) { document.getElementById(id).classList.remove('show'); }

        renderMain();
    </script>
</body>
</html>
