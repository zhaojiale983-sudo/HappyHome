<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#FFFDF7">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>HappyHome</title>
    <link rel="icon" type="image/png" href="https://i.ibb.co/jNcmRdK/retouch-2026111500295066.png">
    <link rel="apple-touch-icon" href="https://i.ibb.co/jNcmRdK/retouch-2026111500295066.png">
    <link rel="manifest" href="./manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <style>
        :root {
            --bg-cream: #FFFDF7;
            --card-cream: #FFF8E7;
            --accent-yellow: #FFD97D;
            --accent-caramel: #F4A261;
            --accent-pink: #FFCAD4;
            --text-brown: #5C4B3B;
            --text-light: #9E8C7A;
            --border-soft: #F3E5C8;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; user-select: none; }
        input, textarea, pre { user-select: text; }
        body {
            font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
            background-color: var(--bg-cream);
            color: var(--text-brown);
            margin: 0;
            padding: 12px 12px 70px 12px;
            max-width: 600px;
            margin: 0 auto;
        }
        #coverPage {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: var(--bg-cream); z-index: 200; display: flex;
            flex-direction: column; align-items: center; justify-content: center;
            text-align: center; padding: 20px; transition: opacity 0.4s ease, visibility 0.4s ease;
        }
        #coverPage.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
        .cover-logo {
            width: 110px; height: 110px; border-radius: 50%; object-fit: cover;
            border: 4px solid var(--accent-yellow); box-shadow: 0 8px 25px rgba(244, 162, 97, 0.25);
            margin-bottom: 22px; animation: bounce 2s infinite ease-in-out;
        }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        .cover-title { font-size: 2.2rem; color: var(--text-brown); margin: 0 0 8px 0; font-weight: bold; }
        .cover-subtitle { font-size: 0.95rem; color: var(--text-light); margin-bottom: 35px; }
        .cover-btn {
            background: var(--accent-yellow); color: var(--text-brown); border: 2px solid var(--accent-caramel);
            padding: 14px 36px; border-radius: 30px; font-size: 1.1rem; font-weight: bold; cursor: pointer;
            box-shadow: 0 6px 18px rgba(255, 217, 125, 0.6);
        }
        header { text-align: center; padding: 8px 0 12px 0; }
        header h1 { margin: 0; font-size: 1.5rem; display: inline-flex; align-items: center; gap: 8px; }
        header h1 img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 2px solid var(--accent-yellow); }
        .search-box { position: relative; margin-bottom: 12px; }
        .search-box input {
            width: 100%; padding: 10px 14px 10px 36px; border-radius: 18px;
            border: 2px solid var(--border-soft); background: #FFFFFF; color: var(--text-brown);
            font-size: 0.9rem; outline: none;
        }
        .search-box::before { content: "🔍"; position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 0.9rem; }
        .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 12px; scrollbar-width: none; }
        .tabs::-webkit-scrollbar { display: none; }
        .tab-btn {
            flex: 0 0 auto; padding: 6px 12px; border-radius: 14px;
            border: 1.5px solid var(--border-soft); background: #FFFFFF; color: var(--text-brown);
            font-weight: 600; font-size: 0.82rem; cursor: pointer;
        }
        .tab-btn.active { background: var(--accent-yellow); border-color: var(--accent-caramel); color: #4A3828; }
.sub-category-bar {
            display: flex; flex-direction: column; gap: 6px; background: var(--card-cream);
            padding: 10px; border-radius: 14px; border: 1.5px dashed var(--accent-caramel); margin-bottom: 12px;
        }
        .cat-row { display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }
        .cat-label { font-size: 0.75rem; font-weight: bold; color: var(--text-light); }
        .cat-chip { padding: 3px 8px; border-radius: 10px; background: #FFFFFF; border: 1px solid var(--border-soft); font-size: 0.75rem; cursor: pointer; }
        .cat-chip.active { background: var(--accent-pink); border-color: #F29CA3; font-weight: bold; }
        .cat-add-btn { padding: 1px 6px; border-radius: 8px; background: var(--accent-yellow); border: none; font-weight: bold; cursor: pointer; font-size: 0.75rem; }
        
        /* 缩小网格：一排4~5个 */
        .grid-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
        @media (min-width: 500px) { .grid-container { grid-template-columns: repeat(5, 1fr); } }
        .list-container { display: flex; flex-direction: column; gap: 8px; }
        
        .square-card {
            background: #FFFFFF; border: 1.5px solid var(--border-soft); border-radius: 16px;
            padding: 8px 4px; display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; aspect-ratio: 1 / 1; box-shadow: 0 2px 6px rgba(92, 75, 59, 0.04);
            cursor: pointer; position: relative;
        }
        .square-card:active { transform: scale(0.95); }
        .square-icon {
            width: 32px; height: 32px; border-radius: 10px; background: var(--card-cream);
            display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
            margin-bottom: 4px; overflow: hidden; border: 1px solid var(--border-soft);
        }
        .square-icon img { width: 100%; height: 100%; object-fit: cover; }
        .square-title { font-size: 0.75rem; font-weight: bold; width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .badge-pwd { position: absolute; top: 4px; right: 4px; font-size: 0.6rem; background: var(--card-cream); padding: 1px 3px; border-radius: 6px; }
        
        .add-card { background: var(--card-cream); border: 1.5px dashed var(--accent-caramel); color: var(--accent-caramel); }
        .add-card .plus { font-size: 1.5rem; line-height: 1; margin-bottom: 2px; }
        .add-card span { font-size: 0.7rem; font-weight: bold; }
        
        /* 缩小世界书/美化等列表卡片 */
        .file-card {
            background: #FFFFFF; border: 1.2px solid var(--border-soft); border-radius: 12px;
            padding: 8px 10px; display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 1px 4px rgba(92, 75, 59, 0.03); transition: transform 0.1s; position: relative;
        }
        .file-card.selected { background: #FFF3CD; border-color: #FFEEBA; }
        .file-card:active { transform: scale(0.98); }
        .file-info { flex: 1; overflow: hidden; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .file-checkbox { width: 18px; height: 18px; accent-color: var(--accent-caramel); cursor: pointer; flex-shrink: 0; }
        .file-name { font-weight: bold; font-size: 0.88rem; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .file-tags { display: flex; gap: 4px; font-size: 0.7rem; color: var(--text-light); flex-wrap: wrap; }
        .file-tag { background: var(--card-cream); padding: 1px 6px; border-radius: 6px; }
.batch-toolbar {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--card-cream); padding: 8px 12px; border-radius: 12px;
            margin-bottom: 10px; border: 1px solid var(--border-soft); font-size: 0.82rem;
        }
        .batch-toolbar button { padding: 4px 10px; border-radius: 8px; border: none; font-weight: bold; cursor: pointer; font-size: 0.78rem; }
        .batch-btn-sel { background: #FFFFFF; color: var(--text-brown); border: 1px solid var(--border-soft); }
        .batch-btn-move { background: var(--accent-yellow); color: #4A3828; }
        .batch-btn-del { background: #FFE5E5; color: #D9534F; }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(92, 75, 59, 0.4); backdrop-filter: blur(3px); z-index: 100;
            align-items: center; justify-content: center; padding: 16px;
        }
        .modal-overlay.show { display: flex; }
        .modal-box {
            background: var(--bg-cream); border: 2px solid var(--accent-yellow); border-radius: 20px;
            width: 100%; max-width: 440px; max-height: 85vh; overflow-y: auto; padding: 16px;
        }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; font-weight: bold; font-size: 1rem; }
        .close-btn { background: var(--card-cream); border: none; width: 26px; height: 26px; border-radius: 50%; cursor: pointer; }
        .form-group { margin-bottom: 10px; }
        .form-group label { display: block; font-size: 0.8rem; font-weight: bold; margin-bottom: 3px; }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%; padding: 8px 10px; border-radius: 10px; border: 1.2px solid var(--border-soft);
            background: #FFFFFF; color: var(--text-brown); font-size: 0.85rem; font-family: inherit;
        }
        .form-group textarea { min-height: 140px; resize: vertical; line-height: 1.4; }
        .btn-primary {
            width: 100%; padding: 10px; border-radius: 12px; border: none;
            background: var(--accent-yellow); color: #4A3828; font-weight: bold; font-size: 0.9rem; cursor: pointer; margin-top: 4px;
        }
        .btn-danger { background: #FFE5E5; color: #D9534F; margin-top: 6px; }
        .browser-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
        .browser-btn {
            padding: 9px 4px; border-radius: 12px; border: 1.2px solid var(--border-soft);
            background: #FFFFFF; color: var(--text-brown); font-weight: bold; text-align: center;
            text-decoration: none; display: block; font-size: 0.82rem; cursor: pointer;
        }
        .browser-btn:active { background: var(--accent-yellow); }
        .copy-info-box { background: var(--card-cream); padding: 8px; border-radius: 10px; font-size: 0.8rem; margin-bottom: 10px; word-break: break-all; }
        .mini-copy-btn { background: var(--accent-caramel); color: white; border: none; border-radius: 6px; padding: 2px 6px; font-size: 0.7rem; margin-left: 4px; cursor: pointer; }
        .hint-text { font-size: 0.72rem; color: var(--text-light); text-align: center; margin-bottom: 6px; }
        .asset-preview { width: 100%; min-height: 180px; border: 1.2px solid var(--border-soft); border-radius: 12px; background: #FFFFFF; overflow: hidden; }
        .asset-preview iframe { width: 100%; height: 300px; border: 0; display: block; background: white; }
        .asset-preview pre { white-space: pre-wrap; overflow-wrap: anywhere; padding: 10px; margin: 0; max-height: 350px; overflow: auto; font-size: 11px; line-height: 1.5; color: var(--text-brown); }
        .font-preview { min-height: 140px; padding: 14px; border-radius: 12px; border: 1.2px dashed var(--accent-caramel); background: white; font-size: 22px; line-height: 1.6; overflow-wrap: anywhere; }
        .asset-actions { display: flex; gap: 6px; margin-top: 8px; }
        .asset-actions button { flex: 1; }
        .small-note { color: var(--text-light); font-size: 0.72rem; line-height: 1.4; margin: 4px 0 10px; }
        .input-copy-row { display:flex; align-items:center; gap:5px; }
        .input-copy-row input { flex:1; min-width:0; }
        .phone-icon-picker { width:52px; height:52px; border:1.2px dashed var(--accent-caramel); border-radius:12px; background:#fff; color:var(--accent-caramel); display:flex; align-items:center; justify-content:center; font-size:1.5rem; cursor:pointer; overflow:hidden; }
        .phone-icon-picker img { width:100%; height:100%; object-fit:cover; }
        .phone-icon-area { display:flex; flex-direction:column; align-items:flex-start; gap:4px; margin-bottom:10px; }
        .phone-icon-area label { font-size:0.8rem; font-weight:bold; }
        .phone-type-bar { display:flex; gap:6px; margin:0 0 10px; }
        .phone-type-btn { flex:1; padding:8px; border:1.2px solid var(--border-soft); border-radius:12px; background:#fff; color:var(--text-brown); font-weight:bold; cursor:pointer; font-size:0.82rem; }
        .phone-type-btn.active { background:var(--accent-yellow); border-color:var(--accent-caramel); }
        .backup-panel { background:var(--card-cream); border:1.2px dashed var(--accent-caramel); border-radius:14px; padding:14px; margin-bottom:12px; }
        .backup-panel p { font-size:0.78rem; line-height:1.5; color:var(--text-light); }
                /* ===== 新增：多选/长按/分类交互样式 ===== */
        * { -webkit-touch-callout: none; }
        .square-card.selected { outline: 2.5px solid var(--accent-caramel); background: #FFF3CD; }
        .sel-mark { display: none; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--accent-caramel); color: #fff; font-size: 0.65rem; align-items: center; justify-content: center; }
        .square-card.selected .sel-mark { display: flex; }
        .file-check { font-size: 1.15rem; color: var(--accent-caramel); flex-shrink: 0; }
        .batch-toolbar { position: sticky; top: 0; z-index: 20; flex-wrap: wrap; gap: 6px; }
        .batch-btns { display: flex; gap: 5px; flex-wrap: wrap; }
        .cat-chip { padding: 5px 10px; font-size: 0.78rem; }
        .cat-add-btn { padding: 4px 10px; }
        
        .hidden { display: none !important; }
        html, body { overscroll-behavior-x: none; }
        body { touch-action: pan-y; }
        @media (display-mode: standalone) { body { padding-top: max(12px, env(safe-area-inset-top)); } }
    </style>
</head>
<body>
    <div id="coverPage">
        <img src="https://i.ibb.co/jNcmRdK/retouch-2026111500295066.png" alt="Logo" class="cover-logo">
        <h1 class="cover-title">HappyHome</h1>
        <p class="cover-subtitle">✨ 欢迎回家，开启你的专属温馨小窝 ✨</p>
        <button class="cover-btn" onclick="enterApp()">点击进入 🐾</button>
    </div>
    <header>
        <h1><img src="https://i.ibb.co/jNcmRdK/retouch-2026111500295066.png" alt="logo"> HappyHome</h1>
    </header>
    <div class="search-box">
        <input type="text" id="searchInput" placeholder="搜索小手机、API、世界书、人设、美化、字体..." oninput="renderMain()">
    </div>
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('phone', this)">📱 小手机</button>
        <button class="tab-btn" onclick="switchTab('api', this)">🔌 API站子</button>
        <button class="tab-btn" onclick="switchTab('worldbook', this)">📖 世界书</button>
        <button class="tab-btn" onclick="switchTab('character', this)">👤 人设</button>
        <button class="tab-btn" onclick="switchTab('theme', this)">🎀 美化</button>
        <button class="tab-btn" onclick="switchTab('font', this)">🔤 字体</button>
        <button class="tab-btn" onclick="switchTab('backup', this)">🗂️ 备份</button>
    </div>
    <div id="mainContent"></div>

    <!-- 小手机 -->
    <div class="modal-overlay" id="phoneModal">
        <div class="modal-box">
            <div class="modal-header"><span>📱 添加小手机</span><button class="close-btn" onclick="closeModal('phoneModal')">✕</button></div>
            <div class="form-group"><label>手机类型</label><select id="pType"><option value="free">免费小手机</option><option value="paid">付费小手机</option></select></div>
            <div class="phone-icon-area">
                <label>图标（可选，留空自动抓取）</label>
                <button type="button" class="phone-icon-picker" id="pIconPreview" onclick="openPhoneIconOptions()">＋</button>
                <div id="pIconOptions" class="asset-actions hidden">
                    <button type="button" class="mini-copy-btn" onclick="setPhoneIconByUrl()">图片 URL</button>
                    <button type="button" class="mini-copy-btn" onclick="document.getElementById('pIconFile').click()">上传</button>
                </div>
                <input type="file" id="pIconFile" accept="image/*" hidden onchange="handlePhoneIconFile(this)">
                <input type="url" id="pIcon" class="hidden" placeholder="图片 URL" oninput="previewPhoneIconUrl()">
            </div>
            <div class="form-group"><label>名称</label><input type="text" id="pName" placeholder="例如：小手机一号"></div>
            <div class="form-group"><label>链接</label><input type="url" id="pUrl" placeholder="https://..."></div>
            <div class="form-group"><label>进入方式</label><select id="pEntry"><option value="">请选择（可选）</option><option value="邮箱">邮箱</option><option value="QQ">QQ</option><option value="DC">DC</option></select></div>
            <div class="form-group"><label>密码</label><input type="text" id="pPwd" placeholder="进入密码（可选）"></div>
            <button class="btn-primary" onclick="savePhone()">保存到 HappyHome</button>
        </div>
    </div>

    <!-- API站子 -->
    <div class="modal-overlay" id="apiModal">
        <div class="modal-box">
            <div class="modal-header"><span>🔌 添加 API 站子</span><button class="close-btn" onclick="closeModal('apiModal')">✕</button></div>
            <div class="form-group"><label>名称</label><input type="text" id="aName" placeholder="例如：中转站A"></div>
            <div class="form-group"><label>地址链接</label><div class="input-copy-row"><input type="url" id="aUrl" placeholder="https://..."><button type="button" class="mini-copy-btn" onclick="copyField('aUrl')">复制</button></div></div>
            <div class="form-group"><label>登录邮箱</label><div class="input-copy-row"><input type="email" id="aEmail" placeholder="邮箱"><button type="button" class="mini-copy-btn" onclick="copyField('aEmail')">复制</button></div></div>
            <div class="form-group"><label>登录密码</label><div class="input-copy-row"><input type="text" id="aPwd" placeholder="密码"><button type="button" class="mini-copy-btn" onclick="copyField('aPwd')">复制</button></div></div>
            <div class="form-group"><label>Base URL</label><div class="input-copy-row"><input type="text" id="aBaseUrl" placeholder="https://..."><button type="button" class="mini-copy-btn" onclick="copyField('aBaseUrl')">复制</button></div></div>
            <div class="form-group"><label>API Key</label><div class="input-copy-row"><input type="text" id="aKey" placeholder="sk-..."><button type="button" class="mini-copy-btn" onclick="copyField('aKey')">复制</button></div></div>
            <button class="btn-primary" onclick="saveApi()">保存 API 站子</button>
        </div>
    </div>

    <!-- 浏览器选择 -->
    <div class="modal-overlay" id="launchModal">
        <div class="modal-box">
            <div class="modal-header"><span id="launchTitle">选择打开方式</span><button class="close-btn" onclick="closeModal('launchModal')">✕</button></div>
            <div id="launchDetails" class="copy-info-box"></div>
            <div class="browser-grid" id="browserButtons"></div>
            <button class="btn-primary btn-danger" id="deleteItemBtn">删除此卡片</button>
        </div>
    </div>

    <!-- 世界书导入 -->
    <div class="modal-overlay" id="importFileModal">
        <div class="modal-box">
            <div class="modal-header"><span>📖 导入世界书</span><button class="close-btn" onclick="closeModal('importFileModal')">✕</button></div>
            <div class="form-group"><label>作者分类</label><select id="impAuthor"></select></div>
            <div class="form-group"><label>功能分类</label><select id="impFunc"></select></div>
            <div class="form-group"><label>手写名称</label><input type="text" id="manualWorldName" placeholder="例如：规则.txt"></div>
            <div class="form-group"><label>手写内容</label><textarea id="manualWorldContent" placeholder="在此编写内容"></textarea></div>
            <div class="form-group"><label>导入文件 (ZIP/DOCX/TXT等)</label><input type="file" id="fileInput" multiple accept=".zip,.docx,.json,.txt,.md"></div>
            <button class="btn-primary" onclick="handleFileImport()">保存 / 确认导入</button>
        </div>
    </div>

    <!-- 人设导入 -->
    <div class="modal-overlay" id="characterModal">
        <div class="modal-box">
            <div class="modal-header"><span>👤 添加人设</span><button class="close-btn" onclick="closeModal('characterModal')">✕</button></div>
            <div class="form-group"><label>作者分类</label><select id="charAuthor"></select></div>
            <div class="form-group"><label>功能分类</label><select id="charFunc"></select></div>
            <div class="form-group"><label>手写名称</label><input id="charManualName" type="text" placeholder="例如：角色.txt"></div>
            <div class="form-group"><label>手写内容</label><textarea id="charManualContent" placeholder="在此编写人设"></textarea></div>
            <div class="form-group"><label>导入文件</label><input type="file" id="charFileInput" multiple accept=".zip,.docx,.json,.txt,.md"></div>
            <button class="btn-primary" onclick="handleCharacterImport()">保存 / 导入</button>
        </div>
    </div>

    <!-- 编辑文件 -->
    <div class="modal-overlay" id="editFileModal">
        <div class="modal-box">
            <div class="modal-header"><span>✏️ 查看与编辑</span><button class="close-btn" onclick="closeModal('editFileModal')">✕</button></div>
            <div class="form-group"><label>文件名称</label><input type="text" id="editFileName"></div>
            <div class="form-group"><label>文件内容</label><textarea id="editFileContent"></textarea></div>
            <button class="btn-primary" onclick="saveFileEdit()">保存修改</button>
            <div class="asset-actions"><button class="btn-primary" onclick="copyCurrentFile()">复制</button><button class="btn-primary" onclick="downloadCurrentFile()">下载</button></div>
            <button class="btn-primary btn-danger" onclick="deleteCurrentFile()">删除此文件</button>
        </div>
    </div>

    <!-- 分类移动 -->
    <div class="modal-overlay" id="moveCatModal">
        <div class="modal-box">
            <div class="modal-header"><span>🏷️ 移动分类</span><button class="close-btn" onclick="closeModal('moveCatModal')">✕</button></div>
            <p id="moveFileName" style="font-size:0.85rem; font-weight:bold; color:var(--accent-caramel);"></p>
            <div class="form-group"><label>作者</label><select id="moveAuthorSel"></select></div>
            <div class="form-group"><label>功能</label><select id="moveFuncSel"></select></div>
            <button class="btn-primary" onclick="confirmMoveCategory()">确认修改分类</button>
        </div>
    </div>

    <!-- 批量移动弹窗 -->
    <div class="modal-overlay" id="batchMoveModal">
        <div class="modal-box">
            <div class="modal-header"><span>📁 批量移动分类</span><button class="close-btn" onclick="closeModal('batchMoveModal')">✕</button></div>
            <div class="form-group"><label>目标作者分类</label><select id="batchMoveAuthorSel"></select></div>
            <div class="form-group"><label>目标功能分类</label><select id="batchMoveFuncSel"></select></div>
            <button class="btn-primary" onclick="confirmBatchMove()">确认批量移动</button>
        </div>
    </div>

    <!-- 美化/字体导入 -->
    <div class="modal-overlay" id="themeImportModal">
        <div class="modal-box">
            <div class="modal-header"><span id="themeImportTitle">🎀 导入美化</span><button class="close-btn" onclick="closeModal('themeImportModal')">✕</button></div>
            <div class="form-group"><label>作者分类</label><select id="themeImpAuthor"></select></div>
            <div class="form-group"><label>功能分类</label><select id="themeImpFunc"></select></div>
            <div class="form-group"><label>选择文件</label><input type="file" id="themeFileInput" multiple accept=".css,.html,.htm,.json,.ttf,.otf,.woff,.woff2"></div>
            <p class="small-note">支持 CSS、HTML、JSON 及各种字体文件。</p>
            <button class="btn-primary" onclick="handleThemeImport()">确认导入</button>
        </div>
    </div>

    <!-- 美化/字体预览 -->
    <div class="modal-overlay" id="themePreviewModal">
        <div class="modal-box">
            <div class="modal-header"><span id="themePreviewTitle">预览</span><button class="close-btn" onclick="closeModal('themePreviewModal')">✕</button></div>
            <div class="form-group"><label>名称</label><input id="themeEditName" type="text"></div>
            <div id="themeTextEditor" class="form-group hidden"><label>内容</label><textarea id="themeEditContent" spellcheck="false"></textarea></div>
            <div id="themePreviewArea" class="asset-preview"></div>
            <div id="fontSampleArea" class="hidden">
                <div class="form-group" style="margin-top:10px;"><label>预览文字</label><textarea id="fontSampleText" rows="2">今天也要开心呀 ♡HappyHome</textarea></div>
                <div id="fontPreview" class="font-preview">今天也要开心呀 ♡</div>
            </div>
            <p id="themePreviewHint" class="small-note"></p>
            <button class="btn-primary" id="themeEditToggle" onclick="toggleThemeEditor()">编辑内容</button>
            <button class="btn-primary" onclick="saveThemeAsset()">保存修改</button>
            <button class="btn-primary" onclick="downloadThemeAsset()">下载</button>
            <button class="btn-primary btn-danger" onclick="deleteThemeAsset()">删除</button>
        </div>
    </div>
<script>
        async function enterApp() {
            document.getElementById('coverPage').classList.add('hidden');
            try {
                if (!document.fullscreenElement && document.documentElement.requestFullscreen) {
                    await document.documentElement.requestFullscreen();
                }
            } catch (e) {}
        }
        document.documentElement.style.overscrollBehaviorX = 'none';
        document.body.style.overscrollBehaviorX = 'none';

        let db = JSON.parse(localStorage.getItem('happyhome_db')) || {
            phones: [], apis: [], files: [],
            categories: {
                character: { authors: ['默认作者'], funcs: ['角色设定', '人物关系'] },
                worldbook: { authors: ['默认作者'], funcs: ['通用设定', '文风增强'] },
                theme: { authors: ['默认作者'], funcs: ['气泡美化', '状态栏'] },
                font: { authors: ['默认作者'], funcs: ['手写体', '可爱体'] }
            }
        };
        db.phones ||= []; db.apis ||= []; db.files ||= []; db.categories ||= {};
        db.categories.character ||= { authors: ['默认作者'], funcs: ['角色设定', '人物关系'] };
        db.categories.worldbook ||= { authors: ['默认作者'], funcs: ['通用设定', '文风增强'] };
        db.categories.theme ||= { authors: ['默认作者'], funcs: ['气泡美化', '状态栏'] };
        db.categories.font ||= { authors: ['默认作者'], funcs: ['手写体', '可爱体'] };
        db.themeAssets ||= [];

        let currentTab = 'phone';
        let selectedAuthor = '全部';
        let selectedFunc = '全部';
        let selectedPhoneType = 'free';
        let currentEditingFileId = null;
        let movingFileId = null;
        let movingAssetId = null;
        let currentThemeAssetId = null;
        let currentFontObjectURL = null;
        let currentFontFace = null;
        let themeEditorVisible = false;

        // 多选批量操作状态
        let isBatchMode = false;
        let selectedIds = new Set();

        function saveDB() { localStorage.setItem('happyhome_db', JSON.stringify(db)); }
        function escapeHTML(value) {
            return String(value ?? '').replace(/[&<>"']/g, ch => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[ch]));
        }

        function switchTab(tab, btnEl) {
            currentTab = tab;
            selectedAuthor = '全部';
            selectedFunc = '全部';
            selectedPhoneType = 'free';
            isBatchMode = false;
            selectedIds.clear();
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btnEl.classList.add('active');
            renderMain();
        }

        function resolveIcon(item, fallbackEmoji) {
            if (item.icon && item.icon.trim() !== '') {
                return `<img src="${escapeHTML(item.icon.trim())}" onerror="this.parentElement.innerHTML='${fallbackEmoji}'">`;
            }
            try {
                const domain = new URL(item.url).hostname;
                return `<img src="https://api.iowen.cn/favicon/${domain}.png" onerror="this.src='https://favicon.im/${domain}?larger=true'; this.onerror=function(){this.parentElement.innerHTML='${fallbackEmoji}';}">`;
            } catch (e) { return fallbackEmoji; }
        }

        function el(tag, cls, html) {
            const e = document.createElement(tag);
            if (cls) e.className = cls;
            if (html !== undefined) e.innerHTML = html;
            return e;
        }
        function rerender() { const y = window.scrollY; renderMain(); window.scrollTo(0, y); }
        function exitBatch() { isBatchMode = false; selectedIds.clear(); }

        function countBy(section, key, val) {
            const isFile = section === 'worldbook' || section === 'character';
            const srcList = isFile ? db.files : db.themeAssets;
            return srcList.filter(x => x.section === section && (val === '全部' || x[key] === val)).length;
        }

        // 分类栏：用 addEventListener，彻底解决点不动的问题
        function renderCategoryBar(section) {
            const cats = db.categories[section] || { authors: [], funcs: [] };
            const bar = el('div', 'sub-category-bar');
            [['author', '按作者：', cats.authors || [], 'authors'], ['func', '按功能：', cats.funcs || [], 'funcs']].forEach(([type, label, arr, listKey]) => {
                const row = el('div', 'cat-row');
                row.appendChild(el('span', 'cat-label', label));
                const cur = type === 'author' ? selectedAuthor : selectedFunc;
                ['全部', ...arr].forEach(name => {
                    const chip = el('span', 'cat-chip' + (cur === name ? ' active' : ''));
                    chip.textContent = `${name} (${countBy(section, type, name)})`;
                    chip.addEventListener('click', () => setFilter(type, name));
                    row.appendChild(chip);
                });
                const add = el('button', 'cat-add-btn', '＋');
                add.addEventListener('click', () => addCategory(listKey));
                row.appendChild(add);
                bar.appendChild(row);
            });
            return bar;
        }

        function setFilter(type, val) {
            if (type === 'author') selectedAuthor = val; else selectedFunc = val;
            exitBatch(); renderMain();
        }
        function addCategory(type) {
            const val = prompt(`请输入${type === 'authors' ? '新作者名称' : '新功能分类名称'}：`);
            if (val && val.trim()) {
                const list = db.categories[currentTab][type];
                if (!list.includes(val.trim())) { list.push(val.trim()); saveDB(); renderMain(); }
            }
        }
        function setPhoneType(type) { selectedPhoneType = type; exitBatch(); renderMain(); }

        // 当前页面可见的项目（全选就选这些）
        function getVisible(kw) {
            const hit = s => (s || '').toLowerCase().includes(kw);
            if (currentTab === 'phone') return db.phones.filter(p => (p.type || 'free') === selectedPhoneType && (hit(p.name) || hit(p.url)));
            if (currentTab === 'api') return db.apis.filter(a => hit(a.name) || hit(a.url));
            const catOk = x => x.section === currentTab && (selectedAuthor === '全部' || x.author === selectedAuthor) && (selectedFunc === '全部' || x.func === selectedFunc);
            if (currentTab === 'worldbook' || currentTab === 'character') return db.files.filter(f => catOk(f) && (!kw || hit(f.name) || hit(f.content)));
            return db.themeAssets.filter(a => catOk(a) && (!kw || hit(a.name)));
        }

        function makeBatchBar(items) {
            const bar = el('div', 'batch-toolbar');
            const allSel = items.length > 0 && items.every(i => selectedIds.has(i.id));
            bar.appendChild(el('span', '', `已选 ${selectedIds.size} 项`));
            const box = el('div', 'batch-btns');
            const add = (cls, txt, fn) => { const b = el('button', cls, txt); b.addEventListener('click', fn); box.appendChild(b); };
            add('batch-btn-sel', allSel ? '取消全选' : '全选', () => {
                items.forEach(i => allSel ? selectedIds.delete(i.id) : selectedIds.add(i.id));
                rerender();
            });
            if (currentTab !== 'api') add('batch-btn-move', '移动', batchMove);
            add('batch-btn-del', '删除', batchDelete);
            add('batch-btn-sel', '完成', () => { exitBatch(); rerender(); });
            bar.appendChild(box);
            return bar;
        }

        function renderMain() {
            const container = document.getElementById('mainContent');
            const keyword = document.getElementById('searchInput').value.trim().toLowerCase();
            container.innerHTML = '';

            if (currentTab === 'backup') {
                container.innerHTML = `
                    <div class="backup-panel">
                        <h3>🗂️ HappyHome 数据备份</h3>
                        <p>将当前浏览器保存的小手机、API、世界书、人设、美化和字体资料打包导出。换设备后打开网址导入即可恢复。</p>
                        <button class="btn-primary" onclick="exportBackup()">导出完整备份文件</button>
                        <div class="form-group" style="margin-top:10px"><label>导入备份文件（JSON）</label><input type="file" id="backupInput" accept=".json,application/json"></div>
                        <button class="btn-primary" onclick="importBackup()">导入并恢复备份</button>
                        </div>`;
                return;
            }
            if (currentTab === 'phone') {
                container.innerHTML = `
                    <div class="phone-type-bar">
                        <button class="phone-type-btn ${selectedPhoneType === 'free' ? 'active' : ''}" onclick="setPhoneType('free')">📱 免费小手机</button>
                        <button class="phone-type-btn ${selectedPhoneType === 'paid' ? 'active' : ''}" onclick="setPhoneType('paid')">💎 付费小手机</button>
                    </div>`;
            } else if (currentTab !== 'api') {
                container.appendChild(renderCategoryBar(currentTab));
            }
            const items = getVisible(keyword);
            if (isBatchMode) container.appendChild(makeBatchBar(items));
            if (currentTab === 'phone' || currentTab === 'api') renderGrid(container, items);
            else renderList(container, items);
        }

        function renderGrid(container, items) {
            const isPhone = currentTab === 'phone';
            const grid = el('div', 'grid-container');
            if (!isBatchMode) {
                const add = el('div', 'square-card add-card', '<div class="plus">＋</div><span>添加</span>');
                add.addEventListener('click', () => openModal(isPhone ? 'phoneModal' : 'apiModal'));
                grid.appendChild(add);
            }
            items.forEach(it => {
                const card = el('div', 'square-card' + (selectedIds.has(it.id) ? ' selected' : ''));
                const badge = isPhone ? (it.pwd ? '<span class="badge-pwd">🔑</span>' : '') : (it.key ? '<span class="badge-pwd">🗝️</span>' : '');
                card.innerHTML = `${badge}<span class="sel-mark">✓</span><div class="square-icon">${resolveIcon(it, isPhone ? '📱' : '🔌')}</div><div class="square-title">${escapeHTML(it.name)}</div>`;
                bindLongPress(card, () => startBatch(it.id), () => {
                    if (isBatchMode) toggleSelectId(it.id); else openLaunchModal(isPhone ? 'phone' : 'api', it.id);
                });
                grid.appendChild(card);
            });
            container.appendChild(grid);
        }

        function renderList(container, items) {
            const sec = currentTab;
            const isFile = sec === 'worldbook' || sec === 'character';
            const list = el('div', 'list-container');
            if (!isBatchMode) {
                const label = sec === 'character' ? '手写 / 导入人设' : sec === 'worldbook' ? '手写 / 导入世界书' : sec === 'font' ? '导入字体文件' : '导入美化文件';
                const add = el('div', 'file-card add-card', `<span style="font-size:1.1rem;margin-right:6px;">＋</span><span>${label}</span>`);
                add.style.cssText = 'justify-content:center;padding:12px;cursor:pointer;';
                add.addEventListener('click', () => sec === 'character' ? openCharacterModal() : sec === 'worldbook' ? openImportModal() : openThemeImportModal(sec));
                list.appendChild(add);
                list.appendChild(el('div', 'hint-text', '💡 长按任意卡片：多选 / 全选 / 移动 / 删除'));
            }
            if (!items.length) list.appendChild(el('div', 'hint-text', '这个分类下还没有内容，点上面的＋导入吧～'));
            items.forEach(it => {
                const sel = selectedIds.has(it.id);
                const card = el('div', 'file-card' + (sel ? ' selected' : ''));
                const icon = isFile ? (sec === 'character' ? '👤' : '📄') : (it.kind === 'font' ? '🔤' : it.kind === 'css' ? '🎨' : '🌐');
                card.innerHTML = `
                    <div class="file-info">
                        ${isBatchMode ? `<span class="file-check">${sel ? '☑' : '☐'}</span>` : ''}
                        <div style="overflow:hidden">
                            <div class="file-name">${icon} ${escapeHTML(it.name)}</div>
                            <div class="file-tags"><span class="file-tag">✍️ ${escapeHTML(it.author)}</span><span class="file-tag">🏷️ ${escapeHTML(it.func)}</span></div>
                        </div>
                    </div>
                    ${isBatchMode ? '' : `<span style="color:var(--accent-caramel);font-size:0.8rem;">${isFile ? '编辑' : '预览'} ›</span>`}`;
                bindLongPress(card, () => startBatch(it.id), () => {
                    if (isBatchMode) toggleSelectId(it.id); else if (isFile) openEditFile(it.id); else openThemePreview(it.id);
                });
                list.appendChild(card);
            });
            container.appendChild(list);
        }

        // 长按：进入多选并选中当前项（已在多选里就切换选中）
        function startBatch(id) {
            if (isBatchMode) { toggleSelectId(id); return; }
            isBatchMode = true; selectedIds.clear(); selectedIds.add(id);
            if (navigator.vibrate) navigator.vibrate(20);
            rerender();
        }
        function toggleSelectId(id) {
            if (selectedIds.has(id)) selectedIds.delete(id); else selectedIds.add(id);
            rerender();
        }

        function batchDelete() {
            if (!selectedIds.size) return alert('请先选择要删除的项目');
            if (!confirm(`确定删除选中的 ${selectedIds.size} 项吗？`)) return;
            if (currentTab === 'phone') db.phones = db.phones.filter(x => !selectedIds.has(x.id));
            else if (currentTab === 'api') db.apis = db.apis.filter(x => !selectedIds.has(x.id));
            else if (currentTab === 'worldbook' || currentTab === 'character') db.files = db.files.filter(x => !selectedIds.has(x.id));
            else {
                const ids = [...selectedIds];
                db.themeAssets = db.themeAssets.filter(x => !selectedIds.has(x.id));
                ids.forEach(id => themeDBAction('delete', id).catch(() => {}));
            }
            saveDB(); exitBatch(); renderMain();
        }

        function batchMove() {
            if (!selectedIds.size) return alert('请先选择要移动的项目');
            if (currentTab === 'phone') {
                const to = selectedPhoneType === 'free' ? 'paid' : 'free';
                if (!confirm(`把选中的 ${selectedIds.size} 个小手机移到「${to === 'paid' ? '付费' : '免费'}小手机」吗？`)) return;
                db.phones.forEach(p => { if (selectedIds.has(p.id)) p.type = to; });
                saveDB(); exitBatch(); renderMain(); return;
            }
            openBatchMoveModal();
        }

        function openBatchMoveModal() {
            const cats = db.categories[currentTab] || { authors: ['默认作者'], funcs: [] };
            document.getElementById('batchMoveAuthorSel').innerHTML = (cats.authors || []).map(a => `<option value="${escapeHTML(a)}">${escapeHTML(a)}</option>`).join('');
            document.getElementById('batchMoveFuncSel').innerHTML = (cats.funcs || []).map(fn => `<option value="${escapeHTML(fn)}">${escapeHTML(fn)}</option>`).join('');
            openModal('batchMoveModal');
        }

        function confirmBatchMove() {
            const author = document.getElementById('batchMoveAuthorSel').value;
            const func = document.getElementById('batchMoveFuncSel').value;
            const target = (currentTab === 'worldbook' || currentTab === 'character') ? db.files : db.themeAssets;
            target.forEach(x => { if (selectedIds.has(x.id)) { x.author = author; x.func = func; } });
            saveDB(); exitBatch(); closeModal('batchMoveModal'); renderMain();
        }

        // 长按：用 pointer 事件，手机和电脑都稳定
        let swallowClick = false;
        function bindLongPress(node, longAction, clickAction) {
            let timer = null, sx = 0, sy = 0;
            const cancel = () => { clearTimeout(timer); timer = null; };
            node.addEventListener('pointerdown', e => {
                swallowClick = false; sx = e.clientX; sy = e.clientY; cancel();
                timer = setTimeout(() => { timer = null; swallowClick = true; longAction(); }, 500);
            });
            node.addEventListener('pointermove', e => {
                if (timer && (Math.abs(e.clientX - sx) > 10 || Math.abs(e.clientY - sy) > 10)) cancel();
            });
            ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => node.addEventListener(t, cancel));
            node.addEventListener('contextmenu', e => e.preventDefault());
            node.addEventListener('click', () => { if (swallowClick) { swallowClick = false; return; } clickAction(); });
        }

        let phoneIconData = '';
        function openPhoneIconOptions() { document.getElementById('pIconOptions').classList.toggle('hidden'); }
        function setPhoneIconByUrl() {
            const url = prompt('请输入图片 URL：', document.getElementById('pIcon').value || '');
            if (url === null) return;
            document.getElementById('pIcon').value = url.trim();
            document.getElementById('pIconOptions').classList.add('hidden');
            previewPhoneIconUrl();
        }
        function handlePhoneIconFile(input) {
            const file = input.files && input.files[0];
            if (!file || !file.type.startsWith('image/')) return;
            const reader = new FileReader();
            reader.onload = event => {
                phoneIconData = event.target.result;
                document.getElementById('pIcon').value = '';
                document.getElementById('pIconPreview').innerHTML = `<img src="${phoneIconData}" alt="图标预览">`;
            };
            reader.readAsDataURL(file);
        }
        function previewPhoneIconUrl() {
            const url = document.getElementById('pIcon').value.trim();
            phoneIconData = '';
            document.getElementById('pIconPreview').innerHTML = url ? `<img src="${escapeHTML(url)}" alt="预览" onerror="this.parentElement.textContent='＋'">` : '＋';
        }

        function savePhone() {
            const name = document.getElementById('pName').value.trim();
            let url = document.getElementById('pUrl').value.trim();
            const icon = phoneIconData || document.getElementById('pIcon').value.trim();
            const entry = document.getElementById('pEntry').value;
            const pwd = document.getElementById('pPwd').value.trim();
            const type = document.getElementById('pType').value || 'free';
            if (!name || !url) return alert('请填写名称和链接');
            if (!url.startsWith('http')) url = 'https://' + url;
            db.phones.push({ id: Date.now(), name, url, icon, entry, pwd, type });
            saveDB(); closeModal('phoneModal');
            ['pName', 'pUrl', 'pIcon', 'pPwd'].forEach(id => document.getElementById(id).value = '');
            document.getElementById('pEntry').value = '';
            document.getElementById('pIconPreview').textContent = '＋';
            phoneIconData = ''; renderMain();
        }

        function copyField(id) { const value = document.getElementById(id).value; if (value) copyText(value); }

        function saveApi() {
            const name = document.getElementById('aName').value.trim();
            let url = document.getElementById('aUrl').value.trim();
            const email = document.getElementById('aEmail').value.trim();
            const pwd = document.getElementById('aPwd').value.trim();
            const baseUrl = document.getElementById('aBaseUrl').value.trim();
            const key = document.getElementById('aKey').value.trim();
            if (!name || !url) return alert('请填写名称和链接');
            if (!url.startsWith('http')) url = 'https://' + url;
            db.apis.push({ id: Date.now(), name, url, email, pwd, baseUrl, key });
            saveDB(); closeModal('apiModal');
            ['aName', 'aUrl', 'aEmail', 'aPwd', 'aBaseUrl', 'aKey'].forEach(id => document.getElementById(id).value = '');
            renderMain();
        }

        function buildEternalIntent(rawUrl) {
            try {
                const target = new URL(rawUrl);
                if (target.protocol !== 'http:' && target.protocol !== 'https:') return rawUrl;
                const fallback = encodeURIComponent(target.href);
                return `intent://${target.host}${target.pathname}${target.search}#Intent;scheme=${target.protocol.slice(0, -1)};package=com.sevensix.everlasting;S.browser_fallback_url=${fallback};end`;
            } catch (e) { return rawUrl; }
        }

        function openLaunchModal(type, id) {
            const item = type === 'phone' ? db.phones.find(x => x.id === id) : db.apis.find(x => x.id === id);
            if (!item) return;
            document.getElementById('launchTitle').innerText = item.name;
            let detailsHtml = `<div>🔗 链接：${escapeHTML(item.url)}</div>`;
            if (type === 'api') {
                if (item.email) detailsHtml += `<div>📧 邮箱：${escapeHTML(item.email)}</div>`;
                if (item.pwd) detailsHtml += `<div>🔑 密码：${escapeHTML(item.pwd)}</div>`;
                if (item.baseUrl) detailsHtml += `<div>🌐 Base URL：${escapeHTML(item.baseUrl)}</div>`;
                if (item.key) detailsHtml += `<div>🗝️ Key：${escapeHTML(item.key)}</div>`;
            } else {
                if (item.entry) detailsHtml += `<div>进入方式：${escapeHTML(item.entry)}</div>`;
                if (item.pwd) detailsHtml += `<div>🔑 密码：${escapeHTML(item.pwd)}</div>`;
            }
            document.getElementById('launchDetails').innerHTML = detailsHtml;
            const cleanUrl = item.url.replace(/^https?:\/\//, '');
            const encUrl = encodeURIComponent(item.url);
            document.getElementById('browserButtons').innerHTML = `
                <a href="${escapeHTML(item.url)}" target="_blank" rel="noopener" class="browser-btn">🧭 默认浏览器</a>
                <a href="${escapeHTML(buildEternalIntent(item.url))}" class="browser-btn">♾️ 永恒浏览器</a>
                <a href="quark://${escapeHTML(cleanUrl)}" class="browser-btn">🐿️ 夸克</a>
                <a href="mttbrowser://url=${encUrl}" class="browser-btn">🐧 QQ</a>
                <a href="via://${escapeHTML(item.url)}" class="browser-btn">🔗 Via</a>
                <a href="googlechrome://navigate?url=${encUrl}" class="browser-btn">🌐 Chrome</a>
                <a href="microsoft-edge-https://${escapeHTML(cleanUrl)}" class="browser-btn">🌊 Edge</a>
                <button class="browser-btn" style="grid-column:span 2;background:var(--card-cream);" data-u="${escapeHTML(item.url)}" onclick="copyText(this.dataset.u)">📋 复制链接</button>`;
            document.getElementById('deleteItemBtn').onclick = () => {
                if (confirm('确定要删除吗？')) {
                    if (type === 'phone') db.phones = db.phones.filter(x => x.id !== id);

        async function importContentFiles(fileList, section, author, func) {
            for (const file of fileList) {
                const lowerName = file.name.toLowerCase();
                if (lowerName.endsWith('.zip')) {
                    try {
                        const zip = await JSZip.loadAsync(file);
                        for (const [relativePath, zipEntry] of Object.entries(zip.files)) {
                            if (zipEntry.dir || relativePath.startsWith('__MACOSX')) continue;
                            const cleanName = relativePath.split('/').pop();
                            if (!cleanName) continue;
                            let content = '';
                            if (cleanName.toLowerCase().endsWith('.docx')) content = await parseDocxArrayBuffer(await zipEntry.async('arraybuffer'));
                            else content = await zipEntry.async('string');
                            db.files.push({ id: Date.now() + Math.random(), section, name: cleanName, author, func, content });
                        }
                    } catch (e) { alert('ZIP 解压失败'); }
                } else {
                    const content = lowerName.endsWith('.docx') ? await parseDocxArrayBuffer(await file.arrayBuffer()) : await readTextFile(file);
                    db.files.push({ id: Date.now() + Math.random(), section, name: file.name, author, func, content });
                }
            }
        }

        function blobToDataURL(blob) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = () => reject(reader.error);
                reader.readAsDataURL(blob);
            });
        }
        function dataURLToBlob(dataURL) {
            const parts = dataURL.split(',');
            const mime = (parts[0].match(/:(.*?);/) || [])[1] || 'application/octet-stream';
            const binary = atob(parts[1] || '');
            const bytes = new Uint8Array(binary.length);
            for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return new Blob([bytes], { type: mime });
        }

            const request = indexedDB.open('HappyHomeThemeFiles', 1);

            request.onsuccess = () => resolve(request.result);

        async function themeDBAction(mode, id, value) {
            const database = await themeDBPromise;
            return new Promise((resolve, reject) => {
                const transaction = database.transaction('assets', 'readwrite');
                const store = transaction.objectStore('assets');
                let request;
                if (mode === 'put') request = store.put(value);
                if (mode === 'get') request = store.get(id);
                if (mode === 'delete') request = store.delete(id);
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

            const apis = (db.apis || []).filter(a => hit(a.name, a.url, a.email, a.pwd, a.baseUrl, a.key, a.cat));

    /* ===== 补丁：Chrome使用googlechrome://直接跳转，其余浏览器保留intent包名唤起 ===== */
{
    const EXTRA_BROWSERS = [
        ['🅇 X浏览器', 'com.mmbox.xbrowser'],
        ['🌧️ 雨见', 'com.yujian.ResideMenuDemo'],
        ['🔭 可拓', 'com.yjllq.kito'],
        ['🦊 火狐', 'org.mozilla.firefox'],
        ['🐎 UC', 'com.UCMobile'],
        ['🛡️ 360', 'com.qihoo.browser'],
        ['🦁 Brave', 'com.brave.browser'],
        ['📱 三星浏览器', 'com.sec.android.app.sbrowser'],
        ['🍊 小米浏览器', 'com.android.browser']
    ];

    function buildPkgIntent(rawUrl, pkg) {
        try {
            const t = new URL(rawUrl);
            if (t.protocol !== 'http:' && t.protocol !== 'https:') return rawUrl;
            return `intent://${t.host}${t.pathname}${t.search}#Intent;scheme=${t.protocol.slice(0,-1)};package=${pkg};S.browser_fallback_url=${encodeURIComponent(t.href)};end`;
        } catch(e) { return rawUrl; }
    }

    const _olmChromeDirect = openLaunchModal;
    openLaunchModal = function (type, id) {
        _olmChromeDirect(type, id);
        const item = (type === 'phone' ? db.phones : db.apis).find(x => x.id === id);
        if (!item) return;
        const box = document.getElementById('browserButtons');

        // ========== Chrome：直接使用 googlechrome:// 协议直接跳转 ==========

        aChrome.className = 'browser-btn';

            a.textContent = name;

        });
    };
