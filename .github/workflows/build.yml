name: Build HappyHome APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK (aapt2 + javac + d8)
        run: |
          # 这里放你原本的打包命令，保持不变
          # 保证最后输出 HappyHome.apk 和 HappyHome-打包.zip 到仓库根目录
          echo "run your compile command here"

      - name: Upload APK & Zip
        uses: actions/upload-artifact@v4
        with:
          name: HappyHome-build
          path: |
            ./HappyHome.apk
            ./HappyHome-打包.zip
