name: Build HappyHome APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: 生成测试文件
        run: |
          echo "test" > HappyHome.apk
          echo "zip" > HappyHome-打包.zip

      - name: Upload files
        uses: actions/upload-artifact@v4
        with:
          name: HappyHome-安装包
          path: |
            ./HappyHome.apk
            ./HappyHome-打包.zip
